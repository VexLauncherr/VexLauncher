name: Build VexLauncher EXE

on:
  push:
    tags:
      - 'v*' # Pokreće se automatski kad god staviš tag (npr. v1.1)

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Izvuci kod (Checkout)
      uses: actions/checkout@v4

    - name: Postavi Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instaliraj sve potrebne biblioteke
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pywebview requests minecraft-launcher-lib pyinstaller

    - name: Kompajliraj u EXE pomoću PyInstallera
      run: |
        pyinstaller --noconsole --onefile --name "VexLauncher" main.py

    - name: Kreiraj Release i učitaj EXE automatski
      uses: softprops/action-gh-release@v1
      with:
        files: dist/VexLauncher.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
