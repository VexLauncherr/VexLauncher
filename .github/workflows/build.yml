name: Auto Build Setup Wizard & Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Izvuci kod (Checkout)
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Postavi Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Očisti stare build i dist mape
      run: |
        if exist build rmdir /s /q build
        if exist dist rmdir /s /q dist
        if exist Output rmdir /s /q Output

    - name: Detektiraj verziju i automatski ažuriraj web i setup.iss
      shell: python
      run: |
        import re
        import os

        # Pronađi Python datoteku u root-u (bilo da je main.py, app.py ili drugo)
        py_files = [f for f in os.listdir('.') if f.endswith('.py')]
        target_py = "main.py"
        for pf in py_files:
            with open(pf, "r", encoding="utf-8", errors="ignore") as f:
                if "launcherVersion" in f.read() or "version" in f.read():
                    target_py = pf
                    break

        print(f"Koristim Python skriptu: {target_py}")
        with open(os.environ['GITHUB_ENV'], 'a') as env_file:
            env_file.write(f"PY_SCRIPT={target_py}\n")

        with open(target_py, "r", encoding="utf-8") as f:
            content = f.read()

        match = re.search(r'"launcherVersion":\s*"v?([0-9]+\.[0-9]+)"', content)
        if not match:
            match = re.search(r'v([0-9]+\.[0-9]+)', content)
        
        raw_ver = match.group(1) if match else "1.2"
        version_tag = f"v{raw_ver}"
        print(f"Pronađena verzija: {version_tag}")

        # Ažuriraj index.html
        if os.path.exists("index.html"):
            with open("index.html", "r", encoding="utf-8") as f:
                html = f.read()
            html = re.sub(r'v[0-9]+\.[0-9]+\s+Release Available Now', f'{version_tag} Release Available Now', html)
            html = re.sub(r'releases/download/v[0-9]+\.[0-9]+/VexLauncher_Setup\.exe', f'releases/download/{version_tag}/VexLauncher_Setup.exe', html)
            with open("index.html", "w", encoding="utf-8") as f:
                f.write(html)

        # Ažuriraj setup.iss
        if os.path.exists("setup.iss"):
            with open("setup.iss", "r", encoding="utf-8") as f:
                iss = f.read()
            iss = re.sub(r'AppVersion=[0-9]+\.[0-9]+', f'AppVersion={raw_ver}', iss)
            with open("setup.iss", "w", encoding="utf-8") as f:
                f.write(iss)

        with open(os.environ['GITHUB_ENV'], 'a') as env_file:
            env_file.write(f"LAUNCHER_VERSION={version_tag}\n")

    - name: Spremi izmjene natrag na GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        git add index.html setup.iss || true
        git commit -m "Auto-update version to ${{ env.LAUNCHER_VERSION }}" || echo "No changes to commit"
        git push || true

    - name: Instaliraj Python biblioteke
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pywebview requests minecraft-launcher-lib pyinstaller

    - name: Kompajliraj novi EXE
      run: |
        pyinstaller --noconsole --onefile --name "VexLauncher" ${{ env.PY_SCRIPT }}

    - name: Instaliraj Inno Setup preko Chocolatey
      run: |
        choco install innosetup -y

    - name: Kreiraj Setup Wizard (.exe)
      run: |
        iscc setup.iss

    - name: Obriši stari Release ako postoji
      uses: dev-drprasad/delete-tag-and-release@v1.1
      with:
        tag_name: ${{ env.LAUNCHER_VERSION }}
        delete_release: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: Kreiraj novi Release i učitaj Wizard
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.LAUNCHER_VERSION }}
        name: VexLauncher ${{ env.LAUNCHER_VERSION }}
        files: Output/VexLauncher_Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
