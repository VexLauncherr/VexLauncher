name: Build and Release EXE

on:
  push:
    tags:
      - 'v*' # Pokreće se automatski kad staviš oznaku verzije (npr. git tag v1.1)

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Izvuci kod
      uses: actions/checkout@v4

    - name: Postavi Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instaliraj pakete
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter requests
        # Ako imaš requirements.txt, otkomentiraj liniju ispod:
        # if (Test-Path "requirements.txt") { pip install -r requirements.txt }

    - name: Napravi EXE pomoću PyInstallera
      run: |
        pyinstaller --noconsole --onefile main.py

    - name: Kreiraj Release i učitaj EXE
      uses: softprops/action-gh-release@v1
      with:
        files: dist/main.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
